    flag: Fc
  ebr:
    name: End Breath
    abbr: ebr
    type: Numerical
    min: 0
    max: 100
    default_value: 0
    is_flag: true
    flag: Eb
  fryh:
    name: Fry Head
    abbr: fryh
    type: Numerical
    min: 0
    max: 100
    default_value: 0
    is_flag: true
    flag: Fh
  fryt:
    name: Fry Tail
    abbr: fryt
    type: Numerical
    min: 0
    max: 100
    default_value: 0
    is_flag: true
    flag: Ft
  trem:
    name: Pitch Tremolo
    abbr: trem
    type: Numerical
    min: 0
    max: 100
    default_value: 0
    is_flag: true
    flag: Tm
  dist:
    name: Distortion
    abbr: dist
    type: Numerical
    min: 0
    max: 100
    default_value: 0
    is_flag: true
    flag: Ds
  bitc:
    name: Bitcrusher
    abbr: bitc
    type: Numerical
    min: 0
    max: 100
    default_value: 0
    is_flag: true
