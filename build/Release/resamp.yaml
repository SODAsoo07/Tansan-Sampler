# Resamp — OpenUTAU Resampler Manifest
# 이 파일을 resamp.exe 와 같은 폴더(Resamplers/)에 함께 배치하세요.
# expression_filter: true 를 활성화하면 여기 없는 기본 표현은 자동으로 비활성화됩니다.

expression_filter: true

expressions:
  gen:
    name: Gender Factor (Formant)
    abbr: gen
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: g
  bre:
    name: Brightness
    abbr: bi
    type: Numerical
    min: 0
    max: 100
    default_value: 50
    is_flag: true
    flag: Bi
  hu:
    name: Husky Tone
    abbr: hu
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: Hu
  tens:
    name: Tension (Phonation)
    abbr: tens
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: t
  harm:
    name: Harmonics
    abbr: harm
    type: Numerical
    min: 0
    max: 100
    default_value: 70
    is_flag: true
    flag: Hr
  nois:
    name: Noise Level
    abbr: nois
    type: Numerical
    min: 0
    max: 100
    default_value: 0
    is_flag: true
    flag: N
  bh:
    name: Breathiness
    abbr: bh
    type: Numerical
    min: 0
    max: 100
    default_value: 0
    is_flag: true
    flag: Bh
  trns:
    name: Transition Length
    abbr: trns
    type: Numerical
    min: 0
    max: 200
    default_value: 100
    is_flag: true
    flag: Tr
  cstab:
    name: Consonant Stability
    abbr: cstab
    type: Numerical
    min: 0
    max: 100
    default_value: 50
    is_flag: true
    flag: Cs
  atk:
    name: Attack
    abbr: atk
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: At
  rel:
    name: Release Air
    abbr: rel
    type: Numerical
    min: 0
    max: 100
    default_value: 0
    is_flag: true
    flag: Rl
  nclr:
    name: Noise Color
    abbr: nclr
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: Ns
  colr:
    name: Voice Color
    abbr: colr
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: c
