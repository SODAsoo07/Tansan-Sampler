# Resamp — OpenUTAU Resampler Manifest
# 이 파일을 resamp.exe 와 같은 폴더(Resamplers/)에 함께 배치하세요.
# expression_filter: true 를 활성화하면 여기 없는 기본 표현은 자동으로 비활성화됩니다.

expression_filter: true

expressions:
  gen:
    name: Gender Factor (Formant)
    abbr: gen
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: g
  bi:
    name: Brightness
    abbr: bi
    type: Numerical
    min: 0
    max: 100
    default_value: 50
    is_flag: true
    flag: Bi
  hu:
    name: Husky Tone
    abbr: hu
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: Hu
  mo:
    name: Mouth Open/Close
    abbr: mo
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: Mo
  tens:
    name: Tension (Phonation)
    abbr: tens
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: Tn
  ptc:
    name: Pitch Cents
    abbr: ptc
    type: Numerical
    min: -1200
    max: 1200
    default_value: 0
    is_flag: true
    flag: t
  gr:
    name: Growl
    abbr: gr
    type: Numerical
    min: 0
    max: 100
    default_value: 0
    is_flag: true
    flag: Gr
  vtl:
    name: Tract Length
    abbr: vtl
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: Vtl
  vtr:
    name: Tract Resonance
    abbr: vtr
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: Vtr
  vtw:
    name: Tract Focus
    abbr: vtw
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: Vtw
  vcs:
    name: Tract Constriction
    abbr: vcs
    type: Numerical
    min: 0
    max: 100
    default_value: 0
    is_flag: true
    flag: Vc
  nn:
    name: Nasal Coupling
    abbr: nn
    type: Numerical
    min: 0
    max: 100
    default_value: 0
    is_flag: true
    flag: Nn
  harm:
    name: Harmonics
    abbr: harm
    type: Numerical
    min: 0
    max: 100
    default_value: 70
    is_flag: true
    flag: Hr
  nois:
    name: Noise Level (+/-)
    abbr: nois
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: N
  bh:
    name: Breathiness (+/-)
    abbr: bh
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: Bh
  trns:
    name: Transition Length
    abbr: trns
    type: Numerical
    min: 0
    max: 200
    default_value: 100
    is_flag: true
    flag: Tr
  cstb:
    name: Consonant Stability
    abbr: cstb
    type: Numerical
    min: 0
    max: 100
    default_value: 50
    is_flag: true
    flag: Cs
  atk:
    name: Attack
    abbr: atk
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: At
  rel:
    name: Release Air
    abbr: rel
    type: Numerical
    min: 0
    max: 100
    default_value: 0
    is_flag: true
    flag: Rl
  nclr:
    name: Noise Color
    abbr: nclr
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: Ns
  colr:
    name: Voice Color
    abbr: colr
    type: Numerical
    min: -100
    max: 100
    default_value: 0
    is_flag: true
    flag: c
